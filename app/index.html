    <style>
      /* Batman rain cover – visible on main screen (phone + PC) */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0c0e;
        overflow: hidden;
      }

      #batman-cover {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: #0b0c0e url('./assets/batman-cover.gif') center center / cover no-repeat;
        pointer-events: none;
      }

      /* Dim overlay so UI text stays readable */
      #batman-cover::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
      }

      #root {
        position: relative;
        z-index: 1;
        min-height: 100vh;
      }
    </style>
